server:
  port: 9208

spring:
  application:
    name: zhixue-ai
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${ZHIXUE_DB_HOST:127.0.0.1}:${ZHIXUE_DB_PORT:3306}/zhixue_ai?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai
    username: ${ZHIXUE_DB_USERNAME:root}
    password: ${ZHIXUE_DB_PASSWORD:}
  data:
    elasticsearch:
      repositories:
        enabled: ${ZHIXUE_AI_ES_REPOSITORIES_ENABLED:false}
  elasticsearch:
    uris: ${ZHIXUE_ES_URIS:http://127.0.0.1:9200}
  main:
    allow-bean-definition-overriding: true
  servlet:
    multipart:
      max-file-size: 1MB
      max-request-size: 2MB
  mvc:
    async:
      # 答疑是异步返回（Mono），默认 30s 超时会先于模型超时触发
      request-timeout: 120s

mybatis-flex:
  mapper-locations: classpath*:mapper/*Mapper.xml
  configuration:
    map-underscore-to-camel-case: true

ai:
  # 本机 Ollama（免费、离线、数据不出本机）。容器内访问宿主机用 http://host.docker.internal:11434
  llm:
    base-url: ${ZHIXUE_AI_BASE_URL:http://127.0.0.1:11434}
    chat-model: ${ZHIXUE_AI_CHAT_MODEL:qwen3.5:9b}
    # embedding-dimension 必须与向量模型输出一致；变更后启动时会自动重建 ES 索引并从数据库写回
    embedding-model: ${ZHIXUE_AI_EMBEDDING_MODEL:qwen3-embedding:0.6b}
    embedding-dimension: ${ZHIXUE_EMBEDDING_DIMENSION:1024}
    chat-timeout-seconds: ${ZHIXUE_AI_CHAT_TIMEOUT:90}
    audit-timeout-seconds: ${ZHIXUE_AI_AUDIT_TIMEOUT:20}
    embedding-timeout-seconds: ${ZHIXUE_AI_EMBEDDING_TIMEOUT:30}
    keep-alive: ${ZHIXUE_AI_KEEP_ALIVE:30m}
  rag:
    # kNN 最低余弦相似度，低于此值的资料不会交给模型
    min-similarity: ${ZHIXUE_AI_RAG_MIN_SIMILARITY:0.45}
  recommend:
    # 均为余弦值（ES _score 已换算），由 scripts/local/ai-reco-check.sh 实测校准，见设计文档 4.4
    course-min-cos: ${ZHIXUE_AI_RECO_COURSE_MIN_COS:0.55}
    lesson-min-cos: ${ZHIXUE_AI_RECO_LESSON_MIN_COS:0.50}
    max-courses: 3
    max-lessons: 2
    lesson-cache-size: 1000

logging:
  level:
    com.zhixue: INFO

management:
  health:
    redis:
      enabled: false

zhixue:
  # 必须配置：扫描 com.zhixue.common 后 InternalAccessFilter 生效，
  # 未配置时网关转发的每个已登录请求都会被判为"非法内部请求"(401)
  security:
    internal-token: ${ZHIXUE_INTERNAL_TOKEN}
  integration:
    ai:
      # stub：不访问模型（单元测试用）；sandbox：模型不可用时检索降级为词法匹配；real：任何失败都如实报错
      mode: ${ZHIXUE_AI_MODE:real}
